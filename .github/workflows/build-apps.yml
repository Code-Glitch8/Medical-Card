name: Build Android APK and Windows installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install web build tools
        run: npm install --no-audit --no-fund
        working-directory: tools
      - name: Build both web bundles (real supabase-js, pinned 2.45.4)
        working-directory: tools
        run: |
          node build-web.mjs android
          node build-web.mjs windows
      - name: Scan for non-anon Supabase keys
        working-directory: tools
        run: node check-no-secrets.mjs ../android/app/src/main/assets ../windows/app-web ../web ../android/app/src ../windows/src
      - name: Syntax-check shims and Electron sources
        run: |
          node --check native/shim-android.js
          node --check native/shim-windows.js
          for f in windows/src/*.cjs windows/src/dialog.js; do node --check "$f"; done

      - name: Browser tests against the built bundles (fake native bridges, mocked Supabase)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          (cd android/app/src/main/assets && python3 -m http.server 8801 >/dev/null 2>&1 &)
          (cd windows/app-web && python3 -m http.server 8802 >/dev/null 2>&1 &)
          sleep 2
          node native/test/shim-android.test.cjs http://127.0.0.1:8801/index.html
          node native/test/app.test.cjs http://127.0.0.1:8801/index.html http://127.0.0.1:8802/index.html

  android:
    needs: web-checks
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build web bundle for Android
        working-directory: tools
        run: |
          npm install --no-audit --no-fund
          node build-web.mjs android
      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Name the artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MedicalCard-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: MedicalCard-debug-apk, path: MedicalCard-debug.apk }
      # Release signing (optional): add repository secrets ANDROID_KEYSTORE_B64 (base64 of the .jks),
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them only the debug APK is built.
      - name: Assemble signed release APK (only if secrets exist)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KS_ALIAS" "$KS_KEYPASS" > keystore.properties
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../MedicalCard.apk
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('MedicalCard.apk') != '' }}
        with: { name: MedicalCard-release-apk, path: MedicalCard.apk }

  windows:
    needs: web-checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install web build tools and build bundle
        working-directory: tools
        run: |
          npm install --no-audit --no-fund
          node build-web.mjs windows
      - name: Build installer
        working-directory: windows
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win nsis --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # unsigned unless you add a code-signing certificate (see docs)
      - uses: actions/upload-artifact@v4
        with: { name: MedicalCardSetup-exe, path: windows/dist/MedicalCardSetup.exe }
